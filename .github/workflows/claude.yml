name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: _plugins/posts-lastmod-hook.rb derives each post's
          # last-modified date from git log, which a shallow clone cannot provide.
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Pick model
        id: model
        # Opus 5.5 by default. Put "/fable" or "/sonnet" anywhere in the
        # @claude comment (or issue body) to use that model instead.
        # The || chain reads the text from whichever event fired: comment,
        # review, or new issue.
        env:
          TEXT: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
        run: |
          case "${TEXT,,}" in
            */fable*)  model=claude-fable-5-1 ;;
            */sonnet*) model=claude-sonnet-5 ;;
            *)         model=claude-opus-5-5 ;;
          esac
          echo "Using $model"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --allowedTools lets Claude build the site to verify its changes.
          claude_args: >-
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Bash(bundle exec jekyll build)"
