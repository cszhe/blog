name: Antigravity Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  antigravity:
    # Trigger when mentioned in an issue, PR, review comment, or review (ignoring bots)
    if: |
      !github.event.sender.bot && (
        (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '@antigravity') || contains(github.event.comment.body, '@gemini'))) ||
        (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, '@antigravity') || contains(github.event.comment.body, '@gemini'))) ||
        (github.event_name == 'pull_request_review' && (contains(github.event.review.body, '@antigravity') || contains(github.event.review.body, '@gemini'))) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@antigravity') || contains(github.event.issue.body, '@gemini') || contains(github.event.issue.title, '@antigravity') || contains(github.event.issue.title, '@gemini')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history is required for posts lastmod hook and git diffing
          fetch-depth: 0

      - name: Checkout PR branch (if Pull Request)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            echo "Checking out PR #$NUMBER"
            gh pr checkout "$NUMBER"
          else
            echo "Running on Issue #$NUMBER (default branch)"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install and configure Antigravity CLI
        run: |
          # Install official Antigravity CLI native binary
          curl --compressed -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Install official Antigravity Python SDK
          pip install google-antigravity

          # Configure agy to authenticate via GEMINI_API_KEY instead of interactive OAuth
          mkdir -p "$HOME/.gemini/antigravity-cli"
          cat << 'EOF' > "$HOME/.gemini/antigravity-cli/settings.json"
          {
            "modelProvider": "gemini",
            "model": "gemini-3.8-flash-high"
          }
          EOF

      - name: Run Antigravity Agent
        id: run-agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.ANTIGRAVITY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.ANTIGRAVITY_API_KEY }}
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY || secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEXT: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
        run: |
          # Extract user instruction safely (strip @antigravity, @gemini, and any repeated @ prefixes)
          PROMPT=$(echo "$TEXT" | sed -E 's/@+(antigravity|gemini)//gi' | sed -E 's/^[[:space:]@]+//')

          # Model selection: Gemini 3.8 Flash by default, or Pro if requested
          case "${TEXT,,}" in
            */pro*)  MODEL="gemini-3.1-pro-high" ;;
            *)       MODEL="gemini-3.8-flash-high" ;;
          esac

          echo "Using model: $MODEL"
          echo "Executing instruction: $PROMPT"

          # Run agy headlessly with tool execution and automatic rate-limit cooldown
          # Note: Free-tier Gemini API keys have a 5 request/min rate limit.
          # When a turn hits this limit, agy pauses; we wait for the quota window and resume with --continue.
          MAX_RETRIES=3
          RETRY_COUNT=0
          DELAY=45

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            > current_turn.txt
            if [ $RETRY_COUNT -eq 0 ]; then
              CMD=(agy --model "$MODEL" --prompt "$PROMPT" --dangerously-skip-permissions)
            else
              echo "Gemini Free Tier rate limit reached. Waiting ${DELAY}s before resuming..."
              sleep $DELAY
              CMD=(agy --model "$MODEL" --continue --dangerously-skip-permissions)
            fi

            set -o pipefail
            if "${CMD[@]}" 2>&1 | tee current_turn.txt; then
              cat current_turn.txt >> agent_output.txt
              echo "Antigravity Agent finished turn successfully."
              break
            fi

            cat current_turn.txt >> agent_output.txt
            if grep -q -E "RESOURCE_EXHAUSTED|Error 429|quota" current_turn.txt; then
              RETRY_COUNT=$((RETRY_COUNT + 1))
            else
              echo "Fatal error encountered."
              exit 1
            fi
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "Exceeded maximum retry attempts for Gemini rate limits."
            exit 1
          fi

      - name: Post comment
        if: always() && steps.run-agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ -s agent_output.txt ]; then
            # Filter out internal error trace logs if retries occurred
            grep -v -E "^(AGY_ERROR:|error: agent executor error:|\* Quota exceeded|Please retry in)" agent_output.txt > clean_output.txt || cp agent_output.txt clean_output.txt
            # Truncate if output exceeds GitHub comment size limit (~65k characters)
            head -c 60000 clean_output.txt > comment_payload.txt
            gh issue comment "$NUMBER" --body-file comment_payload.txt
          fi

      - name: Commit and push changes
        if: steps.run-agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            if [ "$IS_PR" = "true" ]; then
              git add -A
              git commit -m "Apply changes by Antigravity"
              git push
            else
              BRANCH_NAME="antigravity/issue-${NUMBER}"
              git checkout -b "$BRANCH_NAME"
              git add -A
              git commit -m "Apply changes by Antigravity for issue #${NUMBER}"
              git push -u origin "$BRANCH_NAME"
              gh pr create --title "Fix for #${NUMBER} (via Antigravity)" \
                           --body "Automated PR created by Antigravity to address #${NUMBER}." \
                           --head "$BRANCH_NAME"
            fi
          fi
